name: Apply Watched Logger fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-fix-2026-09-04.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply guarded fixes
        run: python3 .github/scripts/app_fix_2026_09_04.py

      - name: Commit fixes
        run: |
          git config user.name "Watched Logger maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/app-fix-2026-09-04.yml .github/scripts/app_fix_2026_09_04.py
          git add index.html supabase/functions/watchlog-reminders/index.ts
          git commit -m "Fix current sorting, release-safe episode tracking and reminder copy"
          git push origin HEAD:main
