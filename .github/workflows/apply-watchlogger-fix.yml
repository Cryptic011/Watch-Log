name: Apply Watched Logger fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watchlogger-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Watched Logger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Could not find patch target: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '<option value="current">Current</option><option value="recent">Recent</option><option value="title">Title A–Z</option><option value="release">Newest release date</option><option value="platform">Platform watched on</option><option value="watched">Date watched</option>',
              '<option value="current">Current</option><option value="recent">Recent</option><option value="title">Title A–Z</option><option value="platform">Platform watched on</option><option value="watched">Date watched</option>',
              'sort menu'
          )
          replace_once(
              'function savedSortMode(){const value=safeReadJSON(SORT_KEY,"current");return ["current","recent","title","release","platform","watched"].includes(value)?value:"current";}',
              'function savedSortMode(){const value=safeReadJSON(SORT_KEY,"current");return value==="release"?"current":(["current","recent","title","platform","watched"].includes(value)?value:"current");}',
              'saved sort mode'
          )

          current_re = re.compile(r'  function currentSortInfo\(item,now=Date\.now\(\)\)\{.*?\n  function knownSeasonTotal', re.S)
          current_new = '''  function currentSortInfo(item,now=Date.now()){
            const day=24*60*60*1000;
            if(isEpisodeTrackable(item)){
              const released=releasedEpisodeCounts(item),hasReleasedEpisodes=Object.keys(released).length>0;
              const nextEpisodeTime=toMillis(item.nextEpisodeDate),latestEpisodeTime=toMillis(item.latestEpisodeDate);
              const scheduledEpisode=hasReleasedEpisodes&&Number(item.nextEpisodeNum||0)>0&&nextEpisodeTime>now&&nextEpisodeTime<=now+90*day;
              const justAired=hasReleasedEpisodes&&latestEpisodeTime>0&&latestEpisodeTime<=now&&now-latestEpisodeTime<=14*day;
              if(scheduledEpisode||justAired)return{current:true,time:justAired?latestEpisodeTime:nextEpisodeTime,kind:2};
            }else if(item?.type==="Film"){
              const release=releaseSortInfo(item,now),releasedDays=release.bucket===2?(now-release.time)/day:Number.POSITIVE_INFINITY;
              if(releasedDays>=0&&releasedDays<=120)return{current:true,time:release.time,kind:1};
            }
            const release=releaseSortInfo(item,now);
            return{current:false,time:release.time,kind:0};
          }
          function compareCurrentOrder(a,b,now=Date.now()){
            const ai=currentSortInfo(a,now),bi=currentSortInfo(b,now);
            if(ai.current!==bi.current)return ai.current?-1:1;
            if(ai.current&&bi.current&&ai.kind!==bi.kind)return bi.kind-ai.kind;
            return compareReleaseRecency(a,b,now);
          }
          function knownSeasonTotal'''
          s, n = current_re.subn(current_new, s, count=1)
          if n != 1:
              raise SystemExit('Could not replace Current sort logic')

          replace_once(
              '    const verified=positiveEpisodeMap(item.airedEpisodeCounts);\n    if(Object.keys(verified).length)return verified;\n    const counts=positiveEpisodeMap(item.episodeCounts);',
              '    const verified=positiveEpisodeMap(item.airedEpisodeCounts);\n    if(item?.episodeScheduleVerified===true)return verified;\n    if(Object.keys(verified).length)return verified;\n    const counts=positiveEpisodeMap(item.episodeCounts);',
              'released episode counts'
          )

          replace_once(
              '  function configureProgressOptions(result){\n    episodeCountsForForm=Object.keys(result?.airedEpisodeCounts||{}).length?result.airedEpisodeCounts:(result?.episodeCounts||{});\n    const highest=Number(result?.highest||0),verifiedEpisodes=result?.episodeScheduleAvailable===true;',
              '  function configureProgressOptions(result){\n    const verifiedEpisodes=result?.episodeScheduleAvailable===true;\n    episodeCountsForForm=verifiedEpisodes?(result?.airedEpisodeCounts||{}):(Object.keys(result?.airedEpisodeCounts||{}).length?result.airedEpisodeCounts:(result?.episodeCounts||{}));\n    const highest=Number(result?.highest||0);',
              'progress options'
          )

          replace_once(
              'configureProgressOptions({highest:item.totalSeasons,episodeCounts:item.episodeCounts||{},airedEpisodeCounts:item.airedEpisodeCounts||{[item.curSeason]:item.currentSeasonEpisodeCount||0},latestAired:item.curSeason,currentEpisode:item.curEp,completedSeasons:item.verifiedCompletedSeasons,episodeScheduleAvailable:Boolean(Object.keys(item.airedEpisodeCounts||{}).length)});',
              'configureProgressOptions({highest:item.totalSeasons,episodeCounts:item.episodeCounts||{},airedEpisodeCounts:item.airedEpisodeCounts||{[item.curSeason]:item.currentSeasonEpisodeCount||0},latestAired:item.curSeason,currentEpisode:item.curEp,completedSeasons:item.verifiedCompletedSeasons,episodeScheduleAvailable:item.episodeScheduleVerified===true||Boolean(Object.keys(item.airedEpisodeCounts||{}).length)});',
              'open editor schedule verification'
          )

          replace_once(
              '          episodeCounts,airedEpisodeCounts,\n          airingSeason:scheduleVerified?(airing?.season??null):current.airingSeason,',
              '          episodeCounts,airedEpisodeCounts,episodeScheduleVerified:scheduleVerified,\n          airingSeason:scheduleVerified?(airing?.season??null):current.airingSeason,',
              'metadata refresh verification flag'
          )

          replace_once(
              '        currentSeasonEpisodeCount:type==="Film"?null:Number(airedEpisodeCounts?.[curSeason]||0)||null,currentSeasonTotalEpisodes:type==="Film"?null:Number(episodeCounts?.[curSeason]||0)||null,episodeCounts:type==="Film"?{}:episodeCounts,airedEpisodeCounts:type==="Film"?{}:airedEpisodeCounts,\n',
              '        currentSeasonEpisodeCount:type==="Film"?null:Number(airedEpisodeCounts?.[curSeason]||0)||null,currentSeasonTotalEpisodes:type==="Film"?null:Number(episodeCounts?.[curSeason]||0)||null,episodeCounts:type==="Film"?{}:episodeCounts,airedEpisodeCounts:type==="Film"?{}:airedEpisodeCounts,\n        episodeScheduleVerified:type==="Film"?false:(verified?.episodeScheduleAvailable===true||previous?.episodeScheduleVerified===true),\n',
              'form save verification flag'
          )

          clean_re = re.compile(r'  function cleanLibraryRecords\(items\)\{.*?\n  \}\n\n  function duplicateCleanupMessage', re.S)
          clean_new = '''  function strictWatchedEpisodeMap(value,counts){
            const result={};
            for(const [seasonValue,episodeValue] of Object.entries(value||{})){
              const season=Number(seasonValue),maximum=Math.max(0,Number(counts?.[season]||0));
              if(!Number.isInteger(season)||season<=0||maximum<=0)continue;
              const source=Array.isArray(episodeValue)?episodeValue:Object.entries(episodeValue||{}).filter(([,watched])=>Boolean(watched)).map(([episode])=>episode);
              const episodes=[...new Set(source.map(Number).filter(episode=>Number.isInteger(episode)&&episode>0&&episode<=maximum))].sort((a,b)=>a-b);
              if(episodes.length)result[season]=episodes;
            }
            return result;
          }

          function sanitizeUnreleasedEpisodeProgress(item){
            if(!isEpisodeTrackable(item)||!item)return item;
            const aired=positiveEpisodeMap(item.airedEpisodeCounts);
            if(item.episodeScheduleVerified!==true)return item;
            const watchedEpisodes=strictWatchedEpisodeMap(Object.prototype.hasOwnProperty.call(item,"watchedEpisodes")?item.watchedEpisodes:legacyWatchedEpisodeMap({...item,episodeScheduleVerified:true},aired),aired);
            const highest=highestWatchedEpisode(watchedEpisodes);
            let curSeason=Math.max(0,Number(item.curSeason||0)),curEp=Math.max(0,Number(item.curEp||0));
            const currentMaximum=Math.max(0,Number(aired[curSeason]||0));
            if(curSeason>0&&currentMaximum>0)curEp=Math.min(curEp,currentMaximum);
            else if(curSeason>0){curSeason=highest?.season||0;curEp=highest?.episode||0;}
            if(curSeason===0)curEp=0;
            const episodeHistory=(Array.isArray(item.episodeHistory)?item.episodeHistory:[]).filter(event=>{
              const season=Number(event?.season),episode=Number(event?.episode),maximum=Math.max(0,Number(aired[season]||0));
              return Number.isInteger(season)&&season>0&&Number.isInteger(episode)&&episode>0&&maximum>0&&episode<=maximum;
            });
            const completedCap=Number.isFinite(Number(item.verifiedCompletedSeasons))?Math.max(0,Number(item.verifiedCompletedSeasons)):Math.max(0,...Object.keys(aired).map(Number));
            const watchedSeasons=Math.min(Math.max(0,Number(item.watchedSeasons||0)),completedCap);
            return {...item,watchedEpisodes,episodeHistory,watchedSeasons,curSeason:curSeason||null,curEp:curEp||null,currentSeasonEpisodeCount:curSeason?(Number(aired[curSeason]||0)||null):null,lastWatchedSeason:highest?.season||null,lastWatchedEpisode:highest?.episode||null,lastEpisodeWatchedAt:highest?(item.lastEpisodeWatchedAt||""):""};
          }

          function cleanLibraryRecords(items){
            const rows=Array.isArray(items)?items:[],shadowCleaned=cleanShadowTitleEntries(rows),shadowRemoved=rows.filter(item=>!shadowCleaned.includes(item)).map(item=>item?.title).filter(Boolean);
            const deduplicated=deduplicateLibrary(shadowCleaned),sanitized=deduplicated.items.map(sanitizeUnreleasedEpisodeProgress);
            let repairedCount=0;
            for(let i=0;i<sanitized.length;i++)if(JSON.stringify(sanitized[i])!==JSON.stringify(deduplicated.items[i]))repairedCount++;
            return{items:sanitized,removedCount:shadowRemoved.length+deduplicated.removedCount,repairedCount,titles:[...new Set([...shadowRemoved,...deduplicated.titles])]};
          }

          function duplicateCleanupMessage'''
          s, n = clean_re.subn(clean_new, s, count=1)
          if n != 1:
              raise SystemExit('Could not install unreleased-episode sanitizer')

          replace_once(
              'if(migration.changed||cleanup.removedCount||cleaned.length!==original.length)await persistLibrary(cleaned);',
              'if(migration.changed||cleanup.removedCount||cleanup.repairedCount||cleaned.length!==original.length)await persistLibrary(cleaned);',
              'persist repaired library on sign-in'
          )
          replace_once(
              'if(migration.changed||cleanup.removedCount||mediaItems.length!==original.length)await persistLibrary(mediaItems);',
              'if(migration.changed||cleanup.removedCount||cleanup.repairedCount||mediaItems.length!==original.length)await persistLibrary(mediaItems);',
              'persist repaired library on sync'
          )

          path.write_text(s)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/apply-watchlogger-fix.yml
          git config user.name "Watched Logger Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-watchlogger-fix.yml
          git diff --cached --check
          git commit -m "Fix Current sorting and unreleased episode tracking"
          git push origin HEAD:main
