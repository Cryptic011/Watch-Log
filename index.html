<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WatchLog</title>

  <!-- iOS / Standalone PWA Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WatchLog" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Embedded App Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%23161b22'/><circle cx='256' cy='256' r='180' fill='%2321262d'/><polygon points='210,160 360,256 210,352' fill='%233b82f6'/></svg>" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%23161b22'/><circle cx='256' cy='256' r='180' fill='%2321262d'/><polygon points='210,160 360,256 210,352' fill='%233b82f6'/></svg>" />

  <!-- Embedded Web Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"WatchLog","short_name":"WatchLog","start_url":".","display":"standalone","background_color":"%230d1117","theme_color":"%230d1117","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 512 512\"><rect width=\"512\" height=\"512\" rx=\"110\" fill=\"%23161b22\"/><circle cx=\"256\" cy=\"256\" r=\"180\" fill=\"%2321262d\"/><polygon points=\"210,160 360,256 210,352\" fill=\"%233b82f6\"/></svg>","sizes":"512x512","type":"image/svg+xml"}]}' />

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-inner: #21262d;
      --accent: #3b82f6;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: #30363d;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
      min-height: 100vh;
    }

    .app-header {
      position: sticky;
      top: 0;
      background-color: rgba(13, 17, 23, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: env(safe-area-inset-top, 16px) 16px 8px 16px;
      z-index: 50;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .icon-btn {
      background: var(--accent);
      border: none;
      color: white;
      font-size: 1.6rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-box {
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .media-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      cursor: pointer;
    }

    .card-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-type { background: rgba(59, 130, 246, 0.15); color: var(--accent); }
    .badge-status { background: rgba(34, 197, 94, 0.15); color: var(--success); }

    .season-card-block {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .season-card-label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .upcoming-banner {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      background: var(--border);
      border: none;
      color: var(--text);
      font-size: 1.1rem;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .ctrl-btn:active { background: var(--accent); color: white; }
    .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    .platform-tag {
      background: #23272e;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.75rem;
    }

    .empty-state {
      text-align: center;
      margin-top: 80px;
      color: var(--text-muted);
    }

    /* Modal Form */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-content {
      background: #161b22;
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(env(safe-area-inset-bottom, 20px) + 20px) 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.8rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-group {
      flex: 1;
    }

    .section-box {
      border: 1px solid var(--border);
      background: #10141a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <h1>WatchLog</h1>
      <button id="add-btn" class="icon-btn" aria-label="Add Media">+</button>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Search titles, platforms..." />
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Watching">Watching</button>
      <button class="filter-btn" data-filter="Plan to Watch">Plan</button>
      <button class="filter-btn" data-filter="Completed">Done</button>
      <button class="filter-btn" data-filter="TV Show">TV Shows</button>
      <button class="filter-btn" data-filter="Movie">Movies</button>
      <button class="filter-btn" data-filter="Anime">Anime</button>
    </div>
  </header>

  <main class="container">
    <div id="media-list" class="media-list"></div>
    <div id="empty-state" class="empty-state hidden">
      <p>No entries found. Tap <strong>+</strong> to start tracking!</p>
    </div>
  </main>

  <!-- Add / Edit Modal -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Log Media</h2>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <form id="media-form">
        <input type="hidden" id="item-id" />

        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. Severance" />

        <div class="form-row">
          <div class="form-group">
            <label for="type">Format</label>
            <select id="type">
              <option value="TV Show">TV Show</option>
              <option value="Movie">Movie</option>
              <option value="Anime">Anime</option>
              <option value="Game">Game</option>
              <option value="Book">Book</option>
            </select>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="Watching">Watching</option>
              <option value="Plan to Watch">Plan to Watch</option>
              <option value="Completed">Completed</option>
              <option value="Dropped">Dropped</option>
            </select>
          </div>
        </div>

        <!-- Current Season Section -->
        <div id="current-season-section" class="section-box">
          <label>Current Season Progress</label>
          <div class="form-row">
            <div class="form-group" style="flex: 0.8;">
              <label for="cur-season-num">Season #</label>
              <input type="number" id="cur-season-num" min="1" value="1" />
            </div>
            <div class="form-group">
              <label for="cur-ep-watched">Watched Ep</label>
              <input type="number" id="cur-ep-watched" min="0" value="0" />
            </div>
            <div class="form-group">
              <label for="cur-season-total">Total Eps</label>
              <input type="number" id="cur-season-total" min="1" placeholder="e.g. 10" />
            </div>
          </div>
        </div>

        <!-- Upcoming Season & Air Date Reminder Section -->
        <div id="upcoming-season-section" class="section-box">
          <label>Upcoming Season & Release Reminder</label>
          <div class="form-row">
            <div class="form-group" style="flex: 0.8;">
              <label for="up-season-num">Next Season #</label>
              <input type="number" id="up-season-num" min="2" placeholder="e.g. 2" />
            </div>
            <div class="form-group">
              <label for="up-season-date">Air / Release Date</label>
              <input type="datetime-local" id="up-season-date" />
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="platform">Streaming / Platform</label>
            <input type="text" id="platform" placeholder="Apple TV+, Netflix, Disney+..." />
          </div>
          <div class="form-group">
            <label for="rating">Rating (1–10)</label>
            <input type="number" id="rating" min="1" max="10" placeholder="★ /10" />
          </div>
        </div>

        <label for="notes">Notes</label>
        <textarea id="notes" rows="3" placeholder="Review, thoughts, theories..."></textarea>

        <div class="modal-actions">
          <button type="button" id="delete-btn" class="btn btn-danger hidden">Delete</button>
          <button type="submit" class="btn btn-primary">Save to Log</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let mediaItems = JSON.parse(localStorage.getItem('watchlog_items')) || [];
    let activeFilter = 'All';
    let searchQuery = '';

    const mediaList = document.getElementById('media-list');
    const emptyState = document.getElementById('empty-state');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const searchInput = document.getElementById('search-input');
    const modal = document.getElementById('modal');
    const addBtn = document.getElementById('add-btn');
    const closeModal = document.getElementById('close-modal');
    const mediaForm = document.getElementById('media-form');
    const deleteBtn = document.getElementById('delete-btn');
    const typeSelect = document.getElementById('type');
    const currentSeasonSection = document.getElementById('current-season-section');
    const upcomingSeasonSection = document.getElementById('upcoming-season-section');

    typeSelect.addEventListener('change', () => {
      const isMovie = typeSelect.value === 'Movie';
      currentSeasonSection.style.display = isMovie ? 'none' : 'flex';
      upcomingSeasonSection.style.display = isMovie ? 'none' : 'flex';
    });

    function save() {
      localStorage.setItem('watchlog_items', JSON.stringify(mediaItems));
    }

    function changeEpisode(itemId, delta) {
      const item = mediaItems.find(i => i.id === itemId);
      if (item) {
        let current = parseInt(item.currentEp) || 0;
        let total = parseInt(item.totalEps) || Infinity;

        let newCount = current + delta;
        if (newCount < 0) newCount = 0;
        if (newCount > total) newCount = total;

        item.currentEp = newCount;

        // Auto update status if reached max
        if (total !== Infinity && newCount >= total) {
          item.status = item.upcomingSeason ? 'Completed' : 'Completed';
        } else if (item.status === 'Completed' && delta < 0) {
          item.status = 'Watching';
        }

        save();
        render();
      }
    }

    function render() {
      mediaList.innerHTML = '';
      
      const filtered = mediaItems.filter(item => {
        const matchesFilter = (activeFilter === 'All') 
          || (item.status === activeFilter) 
          || (item.type === activeFilter);

        const matchesSearch = !searchQuery 
          || item.title.toLowerCase().includes(searchQuery.toLowerCase())
          || (item.platform && item.platform.toLowerCase().includes(searchQuery.toLowerCase()));

        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = 'media-card';

          const isSeries = item.type !== 'Movie';
          const current = parseInt(item.currentEp) || 0;
          const total = parseInt(item.totalEps) || null;
          const isMax = total !== null && current >= total;

          let seriesHTML = '';
          if (isSeries) {
            seriesHTML = `
              <div class="season-card-block">
                <span class="season-card-label">Season ${item.currentSeason || 1}: <strong>Ep ${current}${total ? ` / ${total}` : ''}</strong></span>
                <div class="progress-controls">
                  <button class="ctrl-btn" onclick="changeEpisode('${item.id}', -1)" ${current <= 0 ? 'disabled' : ''}>−</button>
                  <button class="ctrl-btn" onclick="changeEpisode('${item.id}', 1)" ${isMax ? 'disabled' : ''}>+</button>
                </div>
              </div>
            `;

            if (item.upcomingSeason && item.upcomingDate) {
              const airDate = new Date(item.upcomingDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
              seriesHTML += `
                <div class="upcoming-banner">
                  <span>🔔 <strong>Season ${item.upcomingSeason}</strong> Premiere</span>
                  <span>${airDate}</span>
                </div>
              `;
            }
          }

          card.innerHTML = `
            <div class="card-top" onclick="openEditModal('${item.id}')">
              <div class="card-title-group">
                <span class="card-title">${escapeHTML(item.title)}</span>
                <div class="card-meta">
                  <span class="badge badge-type">${item.type}</span>
                  <span class="badge badge-status">${item.status}</span>
                  ${item.rating ? `<span>★ ${item.rating}/10</span>` : ''}
                </div>
              </div>
            </div>

            ${seriesHTML}

            <div class="card-footer">
              <span>${item.platform ? `<span class="platform-tag">${escapeHTML(item.platform)}</span>` : ''}</span>
              ${item.type === 'Movie' && item.upcomingDate ? `<span>⏰ ${new Date(item.upcomingDate).toLocaleDateString()}</span>` : ''}
            </div>
            ${item.notes ? `<p style="font-size:0.8rem; color:var(--text-muted);">${escapeHTML(item.notes)}</p>` : ''}
          `;
          mediaList.appendChild(card);
        });
      }
    }

    function openAddModal() {
      mediaForm.reset();
      document.getElementById('item-id').value = '';
      document.getElementById('modal-title').innerText = 'Add Media';
      document.getElementById('cur-season-num').value = 1;
      document.getElementById('cur-ep-watched').value = 0;
      currentSeasonSection.style.display = 'flex';
      upcomingSeasonSection.style.display = 'flex';
      deleteBtn.classList.add('hidden');
      modal.classList.remove('hidden');
    }

    function openEditModal(id) {
      const item = mediaItems.find(i => i.id === id);
      if (!item) return;

      document.getElementById('item-id').value = item.id;
      document.getElementById('title').value = item.title;
      document.getElementById('type').value = item.type;
      document.getElementById('status').value = item.status;
      document.getElementById('cur-season-num').value = item.currentSeason || 1;
      document.getElementById('cur-ep-watched').value = item.currentEp || 0;
      document.getElementById('cur-season-total').value = item.totalEps || '';
      document.getElementById('up-season-num').value = item.upcomingSeason || '';
      document.getElementById('up-season-date').value = item.upcomingDate || '';
      document.getElementById('platform').value = item.platform || '';
      document.getElementById('rating').value = item.rating || '';
      document.getElementById('notes').value = item.notes || '';

      const isMovie = item.type === 'Movie';
      currentSeasonSection.style.display = isMovie ? 'none' : 'flex';
      upcomingSeasonSection.style.display = isMovie ? 'none' : 'flex';

      document.getElementById('modal-title').innerText = 'Edit Media';
      deleteBtn.classList.remove('hidden');
      modal.classList.remove('hidden');
    }

    mediaForm.onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('item-id').value;
      const type = document.getElementById('type').value;

      let watched = parseInt(document.getElementById('cur-ep-watched').value) || 0;
      let total = document.getElementById('cur-season-total').value ? parseInt(document.getElementById('cur-season-total').value) : '';
      if (total && watched > total) watched = total;

      const data = {
        title: document.getElementById('title').value,
        type: type,
        status: document.getElementById('status').value,
        currentSeason: parseInt(document.getElementById('cur-season-num').value) || 1,
        currentEp: watched,
        totalEps: total,
        upcomingSeason: document.getElementById('up-season-num').value || '',
        upcomingDate: document.getElementById('up-season-date').value || '',
        platform: document.getElementById('platform').value,
        rating: document.getElementById('rating').value,
        notes: document.getElementById('notes').value
      };

      if (id) {
        const idx = mediaItems.findIndex(i => i.id === id);
        if (idx !== -1) mediaItems[idx] = { id, ...data };
      } else {
        mediaItems.unshift({ id: Date.now().toString(), ...data });
      }

      save();
      render();
      modal.classList.add('hidden');
    };

    deleteBtn.onclick = () => {
      const id = document.getElementById('item-id').value;
      if (id) {
        mediaItems = mediaItems.filter(i => i.id !== id);
        save();
        render();
        modal.classList.add('hidden');
      }
    };

    filterBtns.forEach(btn => {
      btn.onclick = () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        render();
      };
    });

    searchInput.oninput = (e) => {
      searchQuery = e.target.value;
      render();
    };

    addBtn.onclick = openAddModal;
    closeModal.onclick = () => modal.classList.add('hidden');

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    render();
  </script>
</body>
</html>
